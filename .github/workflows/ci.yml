name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend install, lint, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend install and import
    # ubuntu-latest is 26.04, whose default Python is 3.14. pipx then installs
    # Poetry on 3.14, and that installer rejects livekit-blingfire's
    # manylinux_2_24 wheels. 24.04 matches the Python this lockfile installs on.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pipx install --python python poetry==2.1.3
      - name: Check the lock file
        run: poetry check --lock
      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi
      - name: Import the package
        run: poetry run python -c "import backend; print('backend import ok')"
